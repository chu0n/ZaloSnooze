name: Native Windows release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c # v2
        id: msys2
        with:
          msystem: MINGW32
          update: true
          install: >-
            mingw-w64-i686-gcc
            mingw-w64-i686-cmake
            mingw-w64-i686-ninja
      - name: Install setup compiler
        if: github.ref_type == 'tag'
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
      - name: Build native x86 app
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: ./.dev/build.ps1 -Msys2Root $env:MSYS2_ROOT
      - name: Run test suite
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: ./.dev/test.ps1 -Msys2Root $env:MSYS2_ROOT
      - name: Build setup and portable ZIP
        if: github.ref_type == 'tag'
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $tag = if ($env:REF_TYPE -eq 'tag') { $env:REF_NAME } else { '' }
          ./.dev/package.ps1 -Msys2Root $env:MSYS2_ROOT -Tag $tag
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref_type == 'tag'
        with:
          name: ZaloSnooze-Windows
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .dev/release/ZaloSnooze-*-Setup.exe
            .dev/release/ZaloSnooze-*-Portable-x86.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: build
    runs-on: windows-latest
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ZaloSnooze-Windows
          path: release
      - name: Publish two release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem release -File | ForEach-Object FullName)
          if ($assets.Count -ne 2) { throw 'Expected setup EXE and portable ZIP only.' }
          $notes = @('Native x86 Windows helper. No extra runtime installation.', '', 'SHA-256:')
          $notes += $assets | ForEach-Object { $file = Get-Item $_; $hash = (Get-FileHash $_ -Algorithm SHA256).Hash.ToLowerInvariant(); "$hash  $($file.Name)" }
          $notes | Set-Content release-notes.txt -Encoding utf8
          gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            throw 'Release already exists. Published assets are immutable; inspect any failed draft before retrying.'
          }
          gh release create $env:GITHUB_REF_NAME @assets --repo $env:GITHUB_REPOSITORY --title $env:GITHUB_REF_NAME --notes-file release-notes.txt --draft --verify-tag
          if ($LASTEXITCODE -ne 0) { throw 'GitHub draft creation or asset upload failed.' }
          gh release edit $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }
