; ZaloSnooze portable settings. Keep this file beside ZaloSnooze.exe.
; Blank ZaloExe uses automatic detection. Paths may be relative to the EXE.
ZaloExe=
Language=vi
LaunchAtStartup=false
MinimizeToTaskbar=false

; Advanced / experimental. Change these only when normal detection fails.
ProcessName=
WindowClass=Chrome_WidgetWin_1
GraceSeconds=45
MaxSeconds=120
MinWidth=350
MinHeight=300
LogFile=
ExperimentalOpacity=false
