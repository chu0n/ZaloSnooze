<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">ZaloSnooze · Zalo snoozes. You stay focused.</title>
  <desc id="desc">Illustrated Windows helper banner, not a Zalo screenshot.</desc>
  <defs>
    <clipPath id="canvas"><rect width="1600" height="560" rx="28"/></clipPath>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".68" numOctaves="3" seed="7" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".085"/></feComponentTransfer>
      <feBlend in="SourceGraphic" mode="soft-light"/>
    </filter>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.8" fill="#fffdf6"/></pattern>
    <pattern id="big-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="5" cy="5" r="3.2" fill="#fffdf6"/></pattern>
  </defs>
  <g clip-path="url(#canvas)">
    <g id="background">
      <rect width="1600" height="560" fill="#005fef"/>
      <path d="M1051-30c-233 235-12 342-130 627h716V-30Z" fill="#003b9e"/>
      <path d="M1095 0h505v323c-149-80-223-43-327-15-115 31-175-70-178-308Z" fill="#062c74" opacity=".72"/>
      <circle cx="1487" cy="18" r="210" fill="url(#dots)" opacity=".32"/>
      <rect x="720" width="205" height="560" fill="url(#big-dots)" opacity=".28"/>
      <rect y="335" width="650" height="225" fill="url(#dots)" opacity=".14"/>
      <path d="M-30 450c201-105 518-35 670 150H-30Z" fill="#0058e0"/>
      <path d="M668 0h267L742 560H536Z" fill="#77adff" opacity=".12"/>
      <path d="M742 518q28-21 55 0t55 0" fill="none" stroke="#ffda72" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 14" opacity=".85"/>
      <g fill="#dceaff" opacity=".76"><circle cx="1117" cy="53" r="4"/><circle cx="1207" cy="101" r="3"/><circle cx="1336" cy="49" r="4"/><circle cx="1436" cy="126" r="3"/><circle cx="1511" cy="67" r="4"/><circle cx="1289" cy="170" r="3"/></g>
      <rect width="1600" height="560" fill="#005fef" opacity=".55" filter="url(#grain)"/>
    </g>
    <path id="star-right" d="m1520 307 8 18 20 4-16 13 2 21-18-11-19 8 5-20-13-15 21-1Z" fill="#ffda72" stroke="#18345b" stroke-width="3" stroke-linejoin="round"/>
    <path id="star-middle" d="m835 72 5 14 15 3-12 9 1 16-13-8-14 5 4-14-9-12 15-1Z" fill="#ffda72" stroke="#18345b" stroke-width="3" stroke-linejoin="round"/>
    <path id="accent" d="M819 399q15 2 22-13m-16 39 21 2" fill="none" stroke="#fffdf6" stroke-width="5" stroke-linecap="round"/>
    <g font-family="Comic Sans MS, Trebuchet MS, cursive">
      <g id="eyebrow">
        <rect x="68" y="57" width="362" height="44" rx="22" fill="#003b9e"/>
        <circle cx="93" cy="79" r="7" fill="#ffda72"/>
        <text x="113" y="85" fill="#fffdf6" font-size="17" font-weight="700" letter-spacing="1.3">A LITTLE WINDOWS HELPER</text>
      </g>
      <g id="wordmark">
        <text x="60" y="242" fill="#003b9e" font-size="108" font-weight="900" letter-spacing="-4">ZaloSnooze</text>
        <text x="60" y="229" fill="#fffdf6" font-size="108" font-weight="900" letter-spacing="-4" stroke="#fffdf6" stroke-width="2" paint-order="stroke fill">ZaloSnooze</text>
      </g>
      <g id="slogan">
        <text x="70" y="297" fill="#fffdf6" font-size="38" font-weight="700" letter-spacing="-.3">Zalo snoozes. You stay focused.</text>
        <text x="72" y="341" fill="#e3efff" font-size="27" font-weight="600">One sleepy click at sign-in.</text>
      </g>
    </g>
    <g id="window">
      <g transform="rotate(4 1195 247)">
        <rect x="929" y="86" width="570" height="330" rx="25" fill="#003b9e"/>
        <rect x="917" y="72" width="570" height="330" rx="25" fill="#fffdf6" stroke="#18345b" stroke-width="5"/>
        <path d="M942 72h520a25 25 0 0 1 25 25v31H917V97a25 25 0 0 1 25-25Z" fill="#dceaff"/>
        <path d="M918 128h568" stroke="#18345b" stroke-width="4"/>
        <circle cx="944" cy="100" r="6" fill="#0068ff"/><circle cx="965" cy="100" r="6" fill="#80b7ff"/><circle cx="986" cy="100" r="6" fill="#b8d6ff"/>
        <text x="1010" y="106" font-family="Comic Sans MS, Trebuchet MS, cursive" font-size="18" font-weight="700" fill="#18345b">a sleepy chat window</text>
        <path d="M1425 99h12m20-5 10 10m0-10-10 10" fill="none" stroke="#18345b" stroke-width="3" stroke-linecap="round"/>
        <rect x="936" y="148" width="130" height="231" rx="12" fill="#edf4ff"/>
        <g fill="#b9d5ff"><circle cx="962" cy="176" r="12"/><circle cx="962" cy="224" r="12"/><circle cx="962" cy="272" r="12"/></g>
        <path d="M987 173h57m-57 10h39m-39 38h48m-48 10h57m-57 38h57m-57 10h33" stroke="#9ebfe9" stroke-width="6" stroke-linecap="round"/>
        <path d="M1103 319q30-17 62-2m180 3q36-17 67 0" fill="none" stroke="#c0d9fc" stroke-width="7" stroke-linecap="round"/>
      </g>
      <image href="logo-transparent.svg" x="1055" y="90" width="338" height="338" transform="rotate(-8 1224 259)"/>
    </g>
    <g id="tray" transform="rotate(-3 1248 462)">
      <rect x="1048" y="429" width="439" height="77" rx="24" fill="#003b9e"/>
      <rect x="1038" y="419" width="439" height="77" rx="24" fill="#fffdf6" stroke="#18345b" stroke-width="5"/>
      <path d="m1065 462 9-9 9 9" fill="none" stroke="#18345b" stroke-width="3" stroke-linecap="round"/>
      <rect x="1108" y="432" width="52" height="52" rx="16" fill="#0068ff" stroke="#18345b" stroke-width="3"/>
      <path d="M1121 444h25v6l-16 16h17v6h-27v-6l16-16h-15Z" fill="#fffdf6"/>
      <text x="1181" y="452" font-family="Comic Sans MS, Trebuchet MS, cursive" font-size="18" font-weight="700" fill="#18345b">Zalo is still running.</text>
      <text x="1181" y="477" font-family="Comic Sans MS, Trebuchet MS, cursive" font-size="16" font-weight="600" fill="#526987">Just tucked into the tray.</text>
    </g>
    <path id="trail" d="M938 322c-78 75-19 162 69 145l-20-13 24 13-18 21" fill="none" stroke="#fffdf6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 12"/>
  </g>
</svg>
